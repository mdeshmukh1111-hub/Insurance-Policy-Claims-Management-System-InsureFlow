# Example Configuration File for InsureFlow
# Rename or copy this file to application.properties and update credentials as required.

server.port=8080

# Database Connection Settings
DB_HOST=localhost
DB_PORT=3306
DB_NAME=insureflow_db
DB_USERNAME=root
DB_PASSWORD=your_mysql_password_here

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
